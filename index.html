<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoEntrego · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="Styles/Styles-index.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
</head>
<body>

  <div class="wrap">
    <div class="brand">
      <img class="img-logo" src="img/LoEntrego2026-transparente.png">
    </div>

    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="sub">Acceso exclusivo para administradores de LoEntrego.</p>

      <div class="form-error" id="formError">Usuario o contraseña incorrectos.</div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" autocomplete="username" required>
          <div class="hint error" id="err-usuario">Ingresa tu usuario.</div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-shell">
            <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">Ver</button>
          </div>
          <div class="hint error" id="err-password">Ingresa tu contraseña.</div>
        </div>

        <div class="row-between" style="justify-content:flex-end;">
          <a href="#" class="forgot-link" id="forgotLink">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="submit" id="submitBtn">Entrar al panel</button>
      </form>
    </div>

    <div class="footer-note">¿Problemas para entrar? Contacta al equipo de soporte de LoEntrego.</div>
  </div>

<script src="Scripts/Scripts-index.js"></script>

</body>
</html>
