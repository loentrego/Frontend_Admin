<main class="login">

  <!-- Acceso -->
  <section class="access" aria-labelledby="title">
    <img class="login-logo" src="img/LoEntrego2026-wordmark.png" alt="LoEntrego" width="1383" height="374">
    <div class="card">
      <p class="kicker">Panel de administración</p>
      <h1 id="title">Iniciar sesión</h1>

      <p class="form-error" id="form-error" role="alert"></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="usuario">Usuario</label>
          <input class="input" type="text" id="usuario" name="usuario" placeholder="Tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <p class="hint" id="err-usuario"></p>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-shell">
            <input class="input" type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
            <button type="button" class="toggle" id="toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <p class="hint" id="err-password"></p>
        </div>

        <button type="submit" class="submit" id="submit-btn">
          <span class="submit-text">Entrar al panel</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <p class="foot-note">¿Problemas para entrar? Escribe a <a href="mailto:contacto@loentrego.com">contacto@loentrego.com</a></p>
    </div>
  </section>

</main>
