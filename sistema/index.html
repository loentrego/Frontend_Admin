<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070518">
<meta name="robots" content="noindex, nofollow">
<title>LoEntrego · Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sistema.css?v=1">
<script>(function(){var t=localStorage.getItem('loentrego-sistema-tema')||'auto';document.documentElement.dataset.tema=t;})();</script>
<link rel="icon" href="../img/icons/icon-192.png">
</head>
<body class="sis-login">

<main class="login">
  <section class="login-card" aria-labelledby="titulo">
    <img class="login-logo" src="../img/LoEntrego2026-wordmark.png" alt="LoEntrego" width="1383" height="374">
    <p class="login-tag"><span class="pulso" aria-hidden="true"></span>Panel de sistema</p>
    <h1 id="titulo">Acceso técnico</h1>
    <p class="login-sub">Servidor, canales, mantenimiento y Nginx. No es el panel de operación.</p>

    <p class="login-error" id="error" role="alert"></p>
    <form id="form" novalidate>
      <label class="campo"><span>Usuario</span>
        <input type="text" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="campo"><span>Contraseña</span>
        <input type="password" id="clave" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primario" id="entrar">Entrar</button>
    </form>
    <p class="login-nota">Solo para la cuenta técnica. El panel de operación está en <a href="../index.html">admin</a>.</p>
  </section>
</main>

<script src="login.js?v=1"></script>
</body>
</html>
